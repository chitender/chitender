  <text x="54" y="164" font-family="Arial,sans-serif" font-size="72" font-weight="700" letter-spacing="-3" fill="#f4f3ec">Architecture</text>
  <text x="56" y="250" font-family="Georgia,serif" font-size="78" font-style="italic" letter-spacing="-3" fill="#d5e9a3">that holds up.</text>
